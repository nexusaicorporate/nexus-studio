name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE=""; fi
          echo "Range: ${RANGE:-<all history>}"
          {
            echo "body<<__NOTES__"
            echo "### What's changed"
            if [ -n "$RANGE" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            else
              git log --no-merges --pretty=format:'- %s (%h)'
            fi
            echo ""
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm deps
        run: npm ci || npm install

      - name: Build + publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Nexus AI Studio ${{ github.ref_name }}"
          releaseBody: |
            ${{ needs.changelog.outputs.notes }}

            ---
            Download the installer for your OS below. Desktop apps auto-update from future releases.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
